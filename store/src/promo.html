<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="common.css">
  <style>
    body { width: 440px; height: 280px; display: flex; flex-direction: column; justify-content: center; padding: 0 34px;
      background: radial-gradient(circle at 85% 15%, #4f46e5 0%, rgba(79,70,229,0) 55%), linear-gradient(135deg, #1a1033, #0e0e10); }
    .row { display: flex; align-items: center; gap: 14px; }
    .row img { width: 54px; height: 54px; }
    h1 { font-size: 34px; font-weight: 800; }
    p { font-size: 19px; color: #d4d4d8; margin-top: 14px; line-height: 1.35; }
    .sub { display: inline-block; margin-top: 16px; background: rgba(0,0,0,.7); border-radius: 6px; padding: 4px 12px;
      font-size: 17px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="row"><img src="logo.svg" alt=""><h1>trtw.tv</h1></div>
  <p>Subtítulos en español en directo para Twitch y YouTube</p>
  <div><span class="sub">Gratis · privado · en tu equipo</span></div>
  <script>
    // Señal para store/render.mjs: todo cargado (imágenes y fuentes incluidas).
    window.addEventListener('load', () => { document.body.dataset.ready = '1'; });
  </script>
</body>
</html>
